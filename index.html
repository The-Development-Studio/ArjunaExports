<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore natural coco coir applications for growing, landscaping, soil care, industry, and animal bedding."
    />
    <title>Coco Coir Applications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --teal: #0b5f5a;
        --body: #4b5563;
        --card: #f8f8f3;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
        color: var(--body);
        font-family: "Poppins", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .applications {
        max-width: 1240px;
        margin: 0 auto;
        padding: 64px 24px;
      }

      .section-heading {
        margin: 0 0 36px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--teal);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--teal);
        font-family: "Archivo Black", sans-serif;
        font-size: clamp(30px, 4vw, 42px);
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: -0.035em;
      }

      .section-intro {
        max-width: 620px;
        margin: 14px 0 0;
        font-size: 15px;
        line-height: 1.7;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: stretch;
        gap: 24px;
      }

      .application-card {
        display: flex;
        min-width: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(11, 95, 90, 0.12);
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        transition:
          transform 250ms ease,
          box-shadow 250ms ease;
      }

      .image-wrap {
        position: relative;
        flex: 0 0 240px;
        height: 240px;
        background: #e8eee7;
      }

      .card-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 400ms ease;
      }

      .icon-badge {
        position: absolute;
        z-index: 1;
        bottom: -20px;
        left: 24px;
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        color: var(--teal);
      }

      .icon-badge svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5;
      }

      .card-content {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 36px 24px 24px;
      }

      .card-title {
        margin: 0 0 8px;
        color: var(--teal);
        font-family: "Archivo Black", sans-serif;
        font-size: 22px;
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: -0.025em;
      }

      .card-description {
        display: -webkit-box;
        overflow: hidden;
        margin: 0;
        color: var(--body);
        font-size: 15px;
        font-weight: 400;
        line-height: 1.6;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .explore-link {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 7px;
        margin-top: auto;
        padding-top: 16px;
        color: var(--teal);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.5;
        text-decoration: none;
      }

      .explore-link span:first-child {
        text-decoration: underline;
        text-decoration-color: transparent;
        text-underline-offset: 4px;
        transition: text-decoration-color 180ms ease;
      }

      .explore-link svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
        transition: transform 180ms ease;
      }

      .explore-link:focus-visible {
        border-radius: 3px;
        outline: 2px solid var(--teal);
        outline-offset: 2px;
      }

      @media (hover: hover) and (pointer: fine) {
        .application-card:hover {
          transform: translateY(-4px);
          box-shadow: 0 14px 32px rgba(0, 0, 0, 0.1);
        }

        .application-card:hover .card-image {
          transform: scale(1.05);
        }

        .application-card:hover .explore-link span:first-child {
          text-decoration-color: currentColor;
        }

        .application-card:hover .explore-link svg {
          transform: translateX(4px);
        }
      }

      @media (max-width: 1023px) {
        .card-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 639px) {
        .applications {
          padding: 48px 20px;
        }

        .section-heading {
          margin-bottom: 28px;
        }

        .card-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }

        .application-card:hover,
        .application-card:hover .card-image {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="applications" aria-labelledby="applications-title">
        <header class="section-heading">
          <p class="eyebrow">Made from coconut fiber</p>
          <h1 id="applications-title">Applications</h1>
          <p class="section-intro">
            Versatile, naturally resilient coir for growing, greener spaces, and
            practical everyday uses.
          </p>
        </header>
        <div class="card-grid" id="application-cards" aria-label="Coco coir applications"></div>
      </section>
    </main>

    <script>
      const icons = {
        hydroponic: `<path d="M12 3.5c-2.1 3-5.5 6.3-5.5 10a5.5 5.5 0 0 0 11 0c0-3.7-3.4-7-5.5-10Z"/><path d="M9.5 14.5c.5-1.5 1.8-2.5 3.8-2.8M12.5 11.8c-.1-1.1.3-2 1.2-2.8"/>`,
        growbags: `<path d="M5 8h14l-1 12H6L5 8Z"/><path d="M8 8c0-2.1 1.8-3.5 4-3.5s4 1.4 4 3.5M8 12h8M9 15.5h6"/>`,
        erosion: `<path d="m3 18 6-8 3 4 3-6 6 10H3Z"/><path d="M5 20h14M9 10l1-2 2 2M15 8l1-2 2 2"/>`,
        mushroom: `<circle cx="12" cy="12" r="9"/><path d="M5.5 11a6.5 4.5 0 0 1 13 0h-13ZM10 11v5.5a2 2 0 0 0 4 0V11M8 20c1.2-.8 2.5-1 4-1s2.8.2 4 1"/>`,
        rooftop: `<path d="M3 20h18M5 20v-7h5v7M14 20v-9h5v9M4 11l3-3 3 3M13 8l3-3 4 4M7 7V5M16 4V3"/><path d="M7.5 5.5c1.5-1 3-.5 3.5.5-1 .8-2.6.7-3.5-.5ZM16.5 3.5c1.3-.8 2.7-.4 3.2.5-.9.7-2.2.6-3.2-.5Z"/>`,
        soil: `<path d="M3 19h18M5 16c2-2.5 4.3-3.7 7-3.7s5 1.2 7 3.7M7 12c1.5-1.3 3.2-2 5-2s3.5.7 5 2M5 7l10 10M5 7h5M5 7v5"/>`,
        propagation: `<path d="M12 20v-9M12 14c-4.5 0-7-2.4-7-6 4.6 0 7 2.1 7 6ZM12 11c0-4.1 2.4-6.5 6-6.5 0 4.4-2.1 6.5-6 6.5Z"/><path d="M8 20h8"/>`,
        oil: `<path d="M8 4C6.3 6.4 4.5 8 4.5 10.3a3.5 3.5 0 0 0 7 0C11.5 8 9.7 6.4 8 4ZM17 11c-1.3 1.9-2.5 3-2.5 4.8a2.5 2.5 0 0 0 5 0C19.5 14 18.3 12.9 17 11Z"/><path d="M5 20h14M8 17v3M12 17v3"/>`,
        animal: `<path d="M20 4c-7 0-12 2.7-14 7-1.5 3.2.2 7 4 7 5 0 10-6 10-14Z"/><path d="M5 20c2-3 5-5 9-7M11 14c-.2-2 .4-3.5 2-4.5"/>`,
        arrow: `<path d="M4 8h11M11 4l4 4-4 4M4 16h16"/>`,
      };

      const applications = [
        {
          title: "Hydroponic Growing Media",
          description: "Consistent coir substrate for soilless growing systems.",
          icon: "hydroponic",
          image: "https://images.unsplash.com/photo-1530836369250-ef72a3f5cda8?auto=format&fit=crop&w=1000&q=85",
          alt: "Lettuce and leafy greens growing in a bright indoor hydroponic greenhouse",
        },
        {
          title: "Grow Bags & Planters",
          description: "Coir-based growing containers for crops and nursery use.",
          icon: "growbags",
          image: "https://images.unsplash.com/photo-1592841200221-a6898f307baa?auto=format&fit=crop&w=1000&q=85",
          alt: "Rows of tomato plants growing in bags inside a greenhouse",
        },
        {
          title: "Erosion Control",
          description: "Natural fiber mats for slope and soil stabilization.",
          icon: "erosion",
          image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=85",
          alt: "Green hillside and riverbank with natural landscape vegetation",
        },
        {
          title: "Mushroom Cultivation",
          description: "Coir-based substrate options for mushroom growing.",
          icon: "mushroom",
          image: "https://images.unsplash.com/photo-1504545102780-26774c1bb073?auto=format&fit=crop&w=1000&q=85",
          alt: "Fresh oyster mushrooms growing in a clean indoor cultivation space",
        },
        {
          title: "Landscaping & Green Roofs",
          description: "Lightweight coir materials for landscape and roof gardens.",
          icon: "rooftop",
          image: "https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=1000&q=85",
          alt: "Lush planted garden with a variety of green foliage",
        },
        {
          title: "Soil Amendment",
          description: "Natural coir fiber to improve moisture retention in soil.",
          icon: "soil",
          image: "https://images.unsplash.com/photo-1589923188900-85dae523342b?auto=format&fit=crop&w=1000&q=85",
          alt: "Rich dark soil being prepared for planting in a garden",
        },
        {
          title: "Plant Propagation",
          description: "Suitable substrate conditions for establishing young plants.",
          icon: "propagation",
          image: "https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=1000&q=85",
          alt: "Young seedlings growing in nursery trays in a greenhouse",
        },
        {
          title: "Industrial Oil Absorption",
          description: "Natural coir-based material for selected absorption applications.",
          icon: "oil",
          image: "https://images.unsplash.com/photo-1516937941344-00b4e0337589?auto=format&fit=crop&w=1000&q=85",
          alt: "Industrial machinery in a factory setting beside a work floor",
        },
        {
          title: "Animal Bedding",
          description: "Natural coir material for applicable animal bedding uses.",
          icon: "animal",
          image: "https://images.unsplash.com/photo-1635009649193-7ed41c32156e?auto=format&fit=crop&w=1000&q=85",
          alt: "Brown horse standing inside a wooden stable",
        },
      ];

      const cardGrid = document.querySelector("#application-cards");

      cardGrid.innerHTML = applications
        .map(
          ({ title, description, icon, image, alt }) => `
            <article class="application-card" id="${title.toLowerCase().replace(/[^a-z0-9]+/g, "-")}">
              <div class="image-wrap">
                <img class="card-image" src="${image}" alt="${alt}" loading="lazy" />
                <span class="icon-badge">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${icons[icon]}</svg>
                </span>
              </div>
              <div class="card-content">
                <h2 class="card-title">${title}</h2>
                <p class="card-description">${description}</p>
                <a class="explore-link" href="#${title.toLowerCase().replace(/[^a-z0-9]+/g, "-")}" aria-label="Explore ${title}">
                  <span>Explore</span>
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </a>
              </div>
            </article>
          `,
        )
        .join("");
    </script>
  </body>
</html>
